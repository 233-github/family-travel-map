<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7">
  <title>家庭旅行地图 · Family Travel Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 999;
      display: grid; place-items: center;
      background: var(--bg-grouped);
      font-family: -apple-system, "PingFang SC", sans-serif;
      transition: opacity .3s ease;
    }
    #boot .inner { text-align: center; color: var(--label-2); }
    #boot .logo { font-size: 44px; }
    #boot .bar { width: 140px; height: 4px; border-radius: 2px; background: var(--fill-tertiary); margin: 16px auto 0; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; background: var(--tint); border-radius: 2px; animation: boot 1s infinite var(--ease-spring); }
    @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
  </style>
</head>
<body>
  <div id="boot" aria-label="加载中">
    <div class="inner">
      <div class="logo">🧭</div>
      <div>家庭旅行地图</div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
